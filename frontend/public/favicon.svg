<svg xmlns="http://www.w3.org/2000/svg" viewBox="142 142 452 452">
  <!-- Same mark as vloombox-logo.svg, cropped tight (~8% margin) so it reads at
       browser-tab sizes. Art bounding box is 178–558 on both axes; centred at 368. -->
