name: Growth preview validation
on:
  pull_request:
    paths: ["frontend/**", ".github/workflows/growth-preview.yml"]
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/growth-preview.yml"]
permissions:
  contents: read
concurrency:
  group: growth-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  growth-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-fixture-not-a-real-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build preview
        run: npm run build
      - name: Resume isolation
        run: npm run test:resume
      - name: SEO contracts
        run: npm run test:seo
      - name: Preview journeys
        run: node test/preview-journeys.mjs
