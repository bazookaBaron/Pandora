name: GSC SEO Report

on:
  push:
    paths:
      - ".github/workflows/gsc-report.yml"
      - "frontend/scripts/gsc-report.mjs"
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gsc-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch Search Console report
        env:
          GSC_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GSC_SERVICE_ACCOUNT_EMAIL }}
          GSC_PRIVATE_KEY: ${{ secrets.GSC_PRIVATE_KEY }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GSC_REPORT_PATH: ../seo-reports/gsc-report.json
        run: node scripts/gsc-report.mjs

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: gsc-seo-report
          path: seo-reports/gsc-report.json
          retention-days: 90
          if-no-files-found: error
