# Vloombox AutoApply inbound mail worker.
#
# Email routing is NOT configured in this file: Cloudflare Email Routing rules live on the zone.
# After `wrangler deploy`, in the dashboard: vloombox.in -> Email -> Email Routing ->
#   Settings: add the subdomain apply.vloombox.in (Cloudflare adds its MX + SPF records)
#   Routing rules -> Catch-all address (for apply.vloombox.in) -> Action "Send to a Worker" -> aa-email-worker
# See README.md for the full checklist.

name = "aa-email-worker"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false          # email-only worker: no public HTTP route

[observability]
enabled = true

# Optional raw .eml archive (mail/YYYY/MM/DD/<uuid>.eml). R2 asks for a card even on the free tier, so it is
# off: the worker runs fine without it. To turn it on later: npx wrangler r2 bucket create aa-mail, then
# uncomment these three lines and deploy again.
# [[r2_buckets]]
# binding = "AA_MAIL"
# bucket_name = "aa-mail"

# Durable retry for mail the API could not accept (it is down, or the secret is wrong): the payload (no raw .eml)
# is parked in a D1 database and re-delivered by the cron below, for up to 3 days. D1 is on the Workers FREE plan
# (5 GB, 100k row writes/day, 5M row reads/day, no card needed); see README "Durable retry". One-time setup:
#   npx wrangler d1 create aa-pending          (prints a database_id)
#   npx wrangler d1 migrations apply aa-pending --remote
# then uncomment the next 4 lines, paste the database_id, and deploy. Without it the worker still runs (only the
# 3 quick tries remain) and the cron is a no-op.
# [[d1_databases]]
# binding = "AA_PENDING"
# database_name = "aa-pending"
# database_id = "<paste the id printed by d1 create>"

[triggers]
crons = ["*/5 * * * *"]   # re-deliver parked mail every 5 minutes

[vars]
# Base URL of the Pandora API (Railway). The worker POSTs to {AA_API_BASE}/api/inbound/email.
AA_API_BASE = "https://www.vloombox.in"

# Secret (never in this file): npx wrangler secret put AA_INBOUND_SECRET
# It must equal AA_INBOUND_SECRET on the API side.
